name: CampusLibrary Build and Unit Checks

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dotnet-build:
    name: .NET 10 Release Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore and build
        run: |
          dotnet restore
          dotnet build -c Release --no-restore
      - name: Check live-smoke script syntax
        run: python3 -m py_compile tests/verify_live_app.py

  android-build:
    name: Android Debug, Unit Tests and Lint
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK tools
        run: sdkmanager 'platforms;android-35' 'build-tools;34.0.0'
      - name: Android build and unit tests
        working-directory: android/CampusLibraryApp
        run: ./gradlew --no-daemon assembleDebug testDebugUnitTest lintDebug
